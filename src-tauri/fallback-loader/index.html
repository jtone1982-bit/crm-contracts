<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM Контракты — загрузка</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f5f1ea;
      color: #2d2520;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 420px;
    }
    .logo {
      font-size: 32px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 12px;
    }
    p {
      font-size: 14px;
      color: #5c4d3d;
      margin: 0 0 24px;
      line-height: 1.5;
    }
    .status {
      font-size: 13px;
      color: #c2410c;
      margin-bottom: 16px;
    }
    button {
      background: #c2410c;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      cursor: pointer;
      margin: 6px;
    }
    button.secondary {
      background: #f0ebe3;
      color: #2d2520;
    }
    .error-log {
      margin-top: 12px;
      font-size: 12px;
      color: #dc2626;
      background: #fef2f2;
      padding: 8px;
      border-radius: 8px;
      text-align: left;
      max-width: 360px;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">К</div>
    <h1>CRM Контракты</h1>
    <p id="status">Проверяем доступность сервера...</p>
    <div id="actions" style="display:none;">
      <button onclick="tryMain()">Повторить основной сервер</button>
      <button class="secondary" onclick="goRu()">Российское зеркало</button>
    </div>
  </div>

  <script>
    const PRIMARY = 'https://tone-crm.ru';
    const FALLBACK = 'https://ru.tone-crm.ru';
    const CHECK_URLS = [
      PRIMARY + '/api/heartbeat',
      PRIMARY + '/login',
    ];
    const TIMEOUT_MS = 5000;
    const MAX_RETRIES = 2;

    let retries = 0;

    function setStatus(text) {
      document.getElementById('status').textContent = text;
    }

    function logError(msg) {
      let container = document.querySelector('.container');
      let existing = document.getElementById('error-log');
      if (!existing) {
        existing = document.createElement('div');
        existing.id = 'error-log';
        existing.className = 'error-log';
        container.appendChild(existing);
      }
      existing.textContent += '\n' + msg;
    }

    function showActions() {
      document.getElementById('actions').style.display = 'block';
    }

    function goPrimary() {
      setStatus('Открываем основной сервер...');
      window.location.href = PRIMARY + '/';
    }

    function goRu() {
      setStatus('Открываем российское зеркало...');
      window.location.href = FALLBACK + '/';
    }

    function checkUrl(url) {
      return new Promise((resolve, reject) => {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);
        let done = false;

        function finish(result, err) {
          if (done) return;
          done = true;
          clearTimeout(timer);
          controller.abort();
          if (!result && err) logError(url + ' → ' + err);
          resolve(result);
        }

        fetch(url, {
          method: 'GET',
          signal: controller.signal,
          cache: 'no-store',
          mode: 'no-cors',
        }).then(() => finish(true)).catch((e) => finish(false, e.message || String(e)));
      });
    }

    async function tryMain() {
      document.getElementById('actions').style.display = 'none';
      retries += 1;
      setStatus('Проверяем доступность основного сервера... (попытка ' + retries + ')');

      let reachable = false;
      for (const url of CHECK_URLS) {
        reachable = await checkUrl(url);
        if (reachable) break;
      }

      if (reachable) {
        goPrimary();
        return;
      }

      if (retries < MAX_RETRIES) {
        setStatus('Основной сервер не отвечает, повторная попытка...');
        setTimeout(tryMain, 1500);
        return;
      }

      setStatus('Основный сервер недоступен. Возможны проблемы у провайдера или на стороне Cloudflare. Переключаем на российское зеркало...');
      setTimeout(goRu, 1000);
    }

    // Start check on load
    tryMain();
  </script>
</body>
</html>
