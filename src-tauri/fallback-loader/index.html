<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM Контракты — загрузка</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f1ea;
      color: #3d2c24;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .container {
      max-width: 420px;
      width: 100%;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 12px;
      font-weight: 700;
    }
    p {
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 16px;
      color: #6b5548;
    }
    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 20px;
    }
    button {
      background: #c2410c;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 15px;
      cursor: pointer;
      font-weight: 600;
    }
    button.secondary {
      background: #e7ded4;
      color: #3d2c24;
    }
    .error-log {
      margin-top: 20px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      text-align: left;
      background: #fff0f0;
      border: 1px solid #f5c2c2;
      color: #a61e1e;
      border-radius: 8px;
      padding: 12px;
      max-height: 180px;
      overflow: auto;
      white-space: pre-wrap;
    }
    .error-log:empty { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>CRM Контракты</h1>
    <p id="status">Определяем лучший сервер...</p>
    <div class="buttons" id="actions" style="display:none;">
      <button onclick="tryAll()">Повторить</button>
      <button class="secondary" onclick="goFallback()">Основной tone-crm.ru</button>
    </div>
  </div>

  <script>
    const SERVERS = [
      { name: 'ru.tone-crm.ru', url: 'https://ru.tone-crm.ru/login' },      // порт 443, быстрый в РФ
      { name: 'ru.tone-crm.ru:8443', url: 'https://ru.tone-crm.ru:8443/login' }, // порт 8443, обход DPI
      { name: 'tone-crm.ru', url: 'https://tone-crm.ru/login' },            // основной через Cloudflare
    ];
    const TIMEOUT_MS = 4000;

    function setStatus(text) {
      document.getElementById('status').textContent = text;
    }

    function logError(msg) {
      let container = document.querySelector('.container');
      let existing = document.getElementById('error-log');
      if (!existing) {
        existing = document.createElement('div');
        existing.id = 'error-log';
        existing.className = 'error-log';
        container.appendChild(existing);
      }
      existing.textContent += (existing.textContent ? '\n' : '') + msg;
    }

    function showActions() {
      document.getElementById('actions').style.display = 'flex';
    }

    function go(url) {
      setStatus('Открываем ' + url.split('/login')[0] + '...');
      window.location.href = url.replace('/login', '/');
    }

    function goFallback() {
      go(SERVERS[2].url);
    }

    function checkServer(server) {
      return new Promise((resolve) => {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);
        let done = false;

        fetch(server.url, {
          method: 'GET',
          signal: controller.signal,
          cache: 'no-store',
          mode: 'no-cors',
        }).then(() => {
          if (!done) {
            done = true;
            clearTimeout(timer);
            resolve({ ok: true, server });
          }
        }).catch((e) => {
          if (!done) {
            done = true;
            clearTimeout(timer);
            resolve({ ok: false, server, error: e.message || String(e) });
          }
        });
      });
    }

    async function tryAll() {
      document.getElementById('actions').style.display = 'none';
      setStatus('Проверяем доступность серверов...');

      for (const server of SERVERS) {
        setStatus('Проверяем ' + server.name + '...');
        const result = await checkServer(server);
        if (result.ok) {
          go(server.url);
          return;
        }
        logError(server.name + ' → ' + result.error);
      }

      setStatus('Ни один сервер не отвечает. Проверьте интернет и попробуйте снова.');
      showActions();
    }

    tryAll();
  </script>
</body>
</html>
