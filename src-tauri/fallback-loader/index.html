<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM Контракты — загрузка</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f1ea;
      color: #3d2c24;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .container {
      max-width: 420px;
      width: 100%;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 12px;
      font-weight: 700;
    }
    p {
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 16px;
      color: #6b5548;
    }
    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 20px;
    }
    button {
      background: #c2410c;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 15px;
      cursor: pointer;
      font-weight: 600;
    }
    button.secondary {
      background: #e7ded4;
      color: #3d2c24;
    }
    .error-log {
      margin-top: 20px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      text-align: left;
      background: #fff0f0;
      border: 1px solid #f5c2c2;
      color: #a61e1e;
      border-radius: 8px;
      padding: 12px;
      max-height: 180px;
      overflow: auto;
      white-space: pre-wrap;
    }
    .error-log:empty { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>CRM Контракты</h1>
    <p id="status">Подключаемся к CRM...</p>
    <div class="buttons" id="actions" style="display:none;">
      <button onclick="tryConnect()">Повторить</button>
      <button class="secondary" onclick="goRu()">Российский сервер</button>
    </div>
  </div>

  <script>
    const PRIMARY = 'https://tone-crm.ru';
    const FALLBACK = 'https://ru.tone-crm.ru';
    const TIMEOUT_MS = 6000;
    const MAX_RETRIES = 2;

    let retries = 0;

    function setStatus(text) {
      document.getElementById('status').textContent = text;
    }

    function logError(msg) {
      let container = document.querySelector('.container');
      let existing = document.getElementById('error-log');
      if (!existing) {
        existing = document.createElement('div');
        existing.id = 'error-log';
        existing.className = 'error-log';
        container.appendChild(existing);
      }
      existing.textContent += (existing.textContent ? '\n' : '') + msg;
    }

    function showActions() {
      document.getElementById('actions').style.display = 'flex';
    }

    function goPrimary() {
      setStatus('Открываем CRM...');
      window.location.href = PRIMARY + '/';
    }

    function goRu() {
      setStatus('Открываем российский сервер...');
      window.location.href = FALLBACK + '/';
    }

    function checkUrl(url) {
      return new Promise((resolve) => {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);
        let done = false;

        fetch(url, {
          method: 'GET',
          signal: controller.signal,
          cache: 'no-store',
          mode: 'no-cors',
        }).then(() => {
          if (!done) {
            done = true;
            clearTimeout(timer);
            resolve(true);
          }
        }).catch((e) => {
          if (!done) {
            done = true;
            clearTimeout(timer);
            logError(url + ' → ' + (e.message || String(e)));
            resolve(false);
          }
        });
      });
    }

    async function tryConnect() {
      document.getElementById('actions').style.display = 'none';
      retries += 1;
      setStatus('Проверяем основной сервер... (попытка ' + retries + '/' + MAX_RETRIES + ')');

      const ok = await checkUrl(PRIMARY + '/login');

      if (ok) {
        goPrimary();
        return;
      }

      if (retries < MAX_RETRIES) {
        setStatus('Основной сервер не отвечает, повторная попытка...');
        setTimeout(tryConnect, 1500);
        return;
      }

      setStatus('Основной сервер недоступен. Попробуйте российский сервер или повторите позже.');
      showActions();
    }

    tryConnect();
  </script>
</body>
</html>
