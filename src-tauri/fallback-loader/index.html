<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM Контракты — загрузка</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f5f1ea;
      color: #2d2520;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 420px;
    }
    .logo {
      font-size: 32px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 12px;
    }
    p {
      font-size: 14px;
      color: #5c4d3d;
      margin: 0 0 24px;
      line-height: 1.5;
    }
    .status {
      font-size: 13px;
      color: #c2410c;
      margin-bottom: 16px;
    }
    button {
      background: #c2410c;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      cursor: pointer;
      margin: 6px;
    }
    button.secondary {
      background: #f0ebe3;
      color: #2d2520;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">К</div>
    <h1>CRM Контракты</h1>
    <p id="status">Проверяем доступность сервера...</p>
    <div id="actions" style="display:none;">
      <button onclick="tryMainManual()">Повторить</button>
      <button class="secondary" onclick="goFallback()">Резервный сервер</button>
    </div>
  </div>

  <script>
    const PRIMARY = 'https://ru.tone-crm.ru:8443';
    const FALLBACK = 'https://tone-crm.ru';
    const CHECK_URLS = [
      PRIMARY + '/login',
    ];
    const TIMEOUT_MS = 3000;
    const MAX_RETRIES = 1;

    let retries = 0;

    function setStatus(text) {
      document.getElementById('status').textContent = text;
    }

    function showActions() {
      document.getElementById('actions').style.display = 'block';
    }

    function goPrimary() {
      setStatus('Открываем CRM...');
      window.location.href = PRIMARY + '/';
    }

    function goFallback() {
      setStatus('Открываем резервный сервер...');
      window.location.href = FALLBACK + '/';
    }

    function checkUrl(url) {
      return new Promise((resolve) => {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);
        let done = false;

        fetch(url, {
          method: 'GET',
          signal: controller.signal,
          cache: 'no-store',
          mode: 'no-cors',
        }).then(() => {
          if (!done) {
            done = true;
            clearTimeout(timer);
            resolve(true);
          }
        }).catch(() => {
          if (!done) {
            done = true;
            clearTimeout(timer);
            resolve(false);
          }
        });
      });
    }

    async function tryMain() {
      retries += 1;
      setStatus('Подключаемся к CRM...');

      let reachable = false;
      for (const url of CHECK_URLS) {
        reachable = await checkUrl(url);
        if (reachable) break;
      }

      if (reachable) {
        goPrimary();
        return;
      }

      if (retries < MAX_RETRIES) {
        setStatus('Повторная попытка...');
        setTimeout(tryMain, 1000);
        return;
      }

      setStatus('Не удалось подключиться. Попробуйте резервный сервер.');
      showActions();
    }

    function tryMainManual() {
      retries = 0;
      tryMain();
    }

    tryMain();
  </script>
</body>
</html>
